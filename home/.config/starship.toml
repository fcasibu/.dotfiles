# Schema for editor validation & autocomplete
"$schema" = "https://starship.rs/config-schema.json"

# Insert a blank line between shell prompts
add_newline = true

# Prompt layout
format = """
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$git_commit\
$git_state\
$rust\
$nodejs\
$python\
$cmd_duration\
$status\
$jobs\
$line_break\
$character"""

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"

[cmd_duration]
min_time = 2000
show_milliseconds = false
style = "dimmed white"

[directory]
style = "bold yellow"

[git_branch]
style = "bold bright-yellow"

[git_status]
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
stashed = "≡"
style = "red"

[hostname]
ssh_only = true

[line_break]
disabled = false

[status]
disabled = false
symbol = "✘ "

[username]
show_always = false
