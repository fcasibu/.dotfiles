[colors]
background     = #14100B
background-alt = #241B12
foreground     = #E4D3B0
foreground-br  = #F2E8D0
disabled       = #9C8767

primary        = #D9A05B
secondary      = #82AFA0
alert          = #CF7F6B

green          = #A3AE78
blue           = #86A3B8
yellow         = #D4B26A
magenta        = #B99BAE

[bar/main]
width = 100%
height = 30pt
cursor-click = pointer

background = #e614100B
foreground = ${colors.foreground}

font-0 = "JetBrainsMono Nerd Font Mono:weight=bold:size=11"

line-size = 4pt

padding-left = 1
padding-right = 1
module-margin = 0

modules-left = arch space date
modules-center = i3
modules-right = cpu space space space memory space space space pulseaudio space


;----------------------------------------------------------
[module/i3]
type = internal/i3
pin-workspaces = true
index-sort = true
enable-click = true
enable-scroll = true
reverse-scroll = false
wrapping-scroll = false

; Focused: number on a raised pill with amber underline
label-focused = %index%
label-focused-foreground = ${colors.primary}
label-focused-background = ${colors.background-alt}
label-focused-underline = ${colors.primary}
label-focused-padding = 2

; Other workspaces that have windows
label-unfocused = %index%
label-unfocused-foreground = ${colors.foreground}
label-unfocused-padding = 2

; Visible on another monitor
label-visible = %index%
label-visible-foreground = ${colors.secondary}
label-visible-underline = ${colors.secondary}
label-visible-padding = 2

label-urgent = %index%
label-urgent-foreground = ${colors.background}
label-urgent-background = ${colors.alert}
label-urgent-padding = 2

;----------------------------------------------------------
[module/cpu]
type = internal/cpu
interval = 2
format-prefix = "󰻠 "
format-prefix-foreground = ${colors.magenta}
label = %percentage:2%%

[module/memory]
type = internal/memory
interval = 2
format-prefix = "󰍛 "
format-prefix-foreground = ${colors.green}
label = %percentage_used:2%%

;----------------------------------------------------------
[module/pulseaudio]
type = internal/pulseaudio

format-volume-prefix = "󰕾 "
format-volume-foreground = ${colors.foreground}
format-volume-prefix-foreground = ${colors.blue}
format-volume = <label-volume>
label-volume = %percentage%%

label-muted = 󰖁 %percentage%%
label-muted-foreground = ${colors.disabled}

;----------------------------------------------------------
[module/date]
type = internal/date
interval = 1

time = %I:%M %p
date = %a, %d %b

; Single color, no icons
label = %time%  │  %date%
format = <label>
format-padding-left = 2
format-padding-right = 2

;----------------------------------------------------------
[module/arch]
type = custom/text
format = 󰣇
format-foreground = ${colors.blue}
format-margin = 0

[module/space]
type = custom/text
format = " "

[module/separator]
type = custom/text
format = "|"
format-foreground = ${colors.disabled}

;----------------------------------------------------------
[settings]
screenchange-reload = true
pseudo-transparency = true
