# Linux clipboard: try xclip first, fall back to wl-clipboard
if-shell 'command -v xclip >/dev/null 2>&1' {
  bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -selection clipboard -in"
  bind-key Y run-shell "tmux capture-pane -J -p | xclip -selection clipboard"
  bind-key C-y run-shell "xclip -selection clipboard -o | tmux load-buffer - && tmux paste-buffer"
}
if-shell 'command -v wl-copy >/dev/null 2>&1' {
  bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy"
  bind-key Y run-shell "tmux capture-pane -J -p | wl-copy"
  bind-key C-y run-shell "wl-paste | tmux load-buffer - && tmux paste-buffer"
}
