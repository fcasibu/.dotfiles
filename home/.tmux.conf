# ── General ──────────────────────────────────────────────────────────
set -g default-terminal "alacritty"
set -g base-index 1
setw -g pane-base-index 1
set -g status-keys vi
set -g mode-keys vi
set -g prefix C-a
unbind C-b
bind C-a send-prefix
set -g mouse on
set -g escape-time 0
set -g history-limit 50000
setw -g aggressive-resize on
setw -g monitor-activity on
set -g visual-activity off
set -g focus-events off

# ── Terminal features ────────────────────────────────────────────────
set-option -gas terminal-overrides "*:Tc"
set-option -gas terminal-overrides "*:RGB"
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

# ── Key bindings ─────────────────────────────────────────────────────
bind-key r source-file ~/.tmux.conf \; display-message "Config reloaded!"
bind-key n new-window
bind-key x kill-window
bind-key c copy-mode
bind-key N command-prompt -p "Session name:" "new-session -s '%%'"

bind-key | split-window -h
bind-key - split-window -v
bind-key X kill-pane

bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

bind-key G new-window -c "#{pane_current_path}" lazygit

bind-key P run-shell '
  s="_popup_"
  if tmux has -t "$s" 2>/dev/null && tmux lsc -t "$s" 2>/dev/null | grep -q .; then
    tmux detach -s "$s"
  else
    tmux new -d -s "$s" 2>/dev/null || true
    cwd=$(tmux display -p "#{pane_current_path}")
    tmux display-popup -E -w 100% -h 60% \
      -y 100% \
      -d "$cwd" "tmux new -A -s $s"
  fi
'

# ── Clipboard ────────────────────────────────────────────────────────
if-shell 'test -f ~/.tmux/clipboard.conf' 'source-file ~/.tmux/clipboard.conf'

# ── Colors ───────────────────────────────────────────────────────────
set -g mode-style "fg=#14100B,bg=#D9A05B"
set -g message-style "fg=#E4D3B0,bg=#241B12"
set -g message-command-style "fg=#E4D3B0,bg=#241B12"
set -g copy-mode-selection-style "fg=#14100B,bg=#D9A05B"

set -g status-interval 5
set -g status-style "fg=#E4D3B0,bg=#14100B"
set -g status-left "#[fg=#14100B,bg=#D9A05B] #S #[fg=#E4D3B0,bg=#14100B] #(whoami) "
set -g status-left-length 100
set -g status-right "#[fg=#9C8767,bg=#14100B] %Y-%m-%d %H:%M "
set -g status-right-length 100
setw -g window-status-format "#[fg=#9C8767,bg=#14100B] #I:#W "
setw -g window-status-current-format "#[fg=#14100B,bg=#D9A05B] #I:#W "
set -g window-status-current-style "nounderscore"
set -g window-status-separator ""

# ── Plugins ──────────────────────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-vim 'session'
set -g @resurrect-strategy-nvim 'session'
set -g @resurrect-save-bash-history 'on'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.tmux/plugins/"

run '~/.tmux/plugins/tpm/tpm'
